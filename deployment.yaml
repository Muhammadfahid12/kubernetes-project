apiVersion: app/v1
kind: Deployment
metadata:
  name: fahid-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fahid-pod
  
  template:
    metadata:
      labels:
        app: fahid-pod
    spec:
      containers:
        - name: fahid-container
          image: muhammadfahid12/project01
          imagePullPolicy: Always
          ports:
            - containerPort: 80

